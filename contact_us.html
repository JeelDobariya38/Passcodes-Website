<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Contact Passcodes team for queries, suggestions or contributions"
        />
        <title>Contact Us | Passcodes</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <header>
            <nav class="navbar">
                <a href="index.html" class="nav-btn">Home</a>
                <a href="download.html" class="nav-btn">Download</a>
                <a href="community.html" class="nav-btn">Community</a>
                <a href="contact_us.html" class="nav-btn">Contact Us</a>
            </nav>
        </header>

        <main>
            <h1 class="floating-animation">Contact Us</h1>

            <div class="contact-container">
                <div class="contact-text">
                    <p>Have questions, suggestions, or want to contribute?</p>
                </div>

                <div class="contact-actions">
                    <a
                        class="outline-btn"
                        href="https://passcodesapp.github.io/Passcodes-Docs/"
                        target="_blank"
                    >
                        <i class="fa-solid fa-book"></i> Docs
                    </a>

                    <a
                        class="outline-btn"
                        href="https://t.me/passcodescommunity"
                        target="_blank"
                    >
                        <i class="fa-brands fa-telegram"></i> Telegram
                    </a>

                    <a
                        class="outline-btn"
                        href="https://github.com/PasscodesApp/Passcodes"
                        target="_blank"
                    >
                        <i class="fa-brands fa-github"></i> GitHub Repo
                    </a>

                    <a
                        href="mailto:jeeldobariya38@gmail.com"
                        class="outline-btn"
                    >
                        <i class="fa-solid fa-envelope"></i> Email Us
                    </a>
                </div>
            </div>
        </main>
        <footer>
            <div>Copyright © Jeel Dobariya 2025-2026</div>
        </footer>
    </body>
</html>
