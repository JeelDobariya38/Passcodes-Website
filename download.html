<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="An password manager app,
            take down the headache of remembering passwords"
        />
        <title>Downloads | Passcodes</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <header>
            <nav class="navbar">
                <a href="index.html" class="nav-btn">Home</a>
                <a href="download.html" class="nav-btn">Download</a>
                <a href="community.html" class="nav-btn">Community</a>
                <a href="contact_us.html" class="nav-btn">Contact Us</a>
                <a href="test_suite.html" class="nav-btn test">Test Suite</a>
            </nav>
        </header>

        <main>
            <h1 class="floating-animation">Other Downloads</h1>
            <div id="releases-container" class="releases-container">
                <p id="loading-text">Loading releases...</p>
                <!-- Releases will be loaded dynamically -->
            </div>
        </main>

        <footer>
            <div>Copyright © Jeel Dobariya 2025-2026</div>
        </footer>
        <script>
            const repoOwner = "PasscodesApp";
            const repoName = "Passcodes";

            async function fetchReleases() {
                const repoOwner = "PasscodesApp";
                const repoName = "Passcodes";

                const url = `https://api.github.com/repos/${repoOwner}/${repoName}/releases`;

                const container = document.getElementById("releases-container");
                const loading = document.getElementById("loading-text");

                // Render function
                function renderReleases(releases) {
                    container.innerHTML = "";

                    releases.forEach((release, index) => {
                        const version = release.tag_name;
                        const isLatest = index === 0;

                        let type = "stable";
                        if (version.toLowerCase().includes("beta"))
                            type = "beta";
                        if (version.toLowerCase().includes("alpha"))
                            type = "alpha";

                        const apkAsset = release.assets.find((asset) =>
                            asset.name.endsWith(".apk"),
                        );

                        if (!apkAsset) return; //  skip invalid releases

                        const downloadLink = apkAsset.browser_download_url;
                        const notesLink = release.html_url;

                        const card = document.createElement("div");
                        card.className = `release-card ${isLatest ? "latest" : ""}`;

                        card.innerHTML = `
            <div class="release-top">
                <h3>${version}</h3>
                <span class="tag ${type}">${type}</span>
            </div>

            ${isLatest ? '<p class="release-date">Latest Release</p>' : ""}

            <div class="release-actions">
                <a href="${downloadLink}" class="btn btn-small btn-filled">
                    <i class="fa-solid fa-download"></i> Download
                </a>
                <a href="${notesLink}" class="btn btn-small btn-outline">
                    Release Notes
                </a>
            </div>
        `;

                        container.appendChild(card);
                    });
                }

                // Main fetch function
                async function fetchReleases() {
                    try {
                        const response = await fetch(url);
                        const releases = await response.json();

                        localStorage.setItem(
                            "releases",
                            JSON.stringify(releases),
                        );

                        loading.style.display = "none"; // THIS LINE

                        renderReleases(releases);
                    } catch (error) {
                        console.error("Error fetching releases:", error);
                    }
                }

                // Load cached first (instant UI)
                const cached = localStorage.getItem("releases");

                if (cached) {
                    renderReleases(JSON.parse(cached));
                    loading.style.display = "none";
                } else {
                    fetchReleases();
                }
            }

            fetchReleases();
        </script>
    </body>
</html>
