<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A password manager app,
            take down the headache of remembering passwords"
        />
        <title>Downloads | Passcodes</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="transition.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <header>
            <nav class="navbar">
                <a href="index.html" class="nav-btn">Home</a>
                <a href="download.html" class="nav-btn active-nav">Download</a>
                <a href="community.html" class="nav-btn">Community</a>
                <a href="contact_us.html" class="nav-btn">Contact Us</a>
                <a
                    href="https://github.com/PasscodesApp/Passcodes"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="nav-btn github-nav"
                >
                    <i class="fa-brands fa-github"></i>
                </a>
            </nav>
        </header>

        <main>
            <h1 class="floating-animation">Other Downloads</h1>
            <p class="page-subtitle">
                Download the latest releases of Passcodes for Android. All
                builds are open-source and publicly available on GitHub.
            </p>
            <div class="release-search">
                <input
                    type="text"
                    id="release-search"
                    placeholder="Search releases..."
                />
            </div>
            <div class="release-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="stable">Stable</button>
                <button class="filter-btn" data-filter="beta">Beta</button>
                <button class="filter-btn" data-filter="alpha">Alpha</button>
            </div>
            <div id="releases-container" class="releases-container">
                <div id="loading-text" class="loading-state">
                    <div class="loading-card"></div>
                    <div class="loading-card"></div>
                    <div class="loading-card"></div>
                </div>
                <!-- Releases will be loaded dynamically -->
            </div>
        </main>

        <footer>
            <div>Copyright © Jeel Dobariya 2025-2026</div>
        </footer>
        <script type="module" src="download.js"></script>
    </body>
</html>
