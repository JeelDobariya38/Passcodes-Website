# Upstream Trigger Workflow for: PasscodesApp/Passcodes
# Place this file at: .github/workflows/notify-website.yml in PasscodesApp/Passcodes
#
# Purpose:
# Automatically notifies PasscodesApp/Passcodes-Website whenever a new GitHub Release
# is published or updated, triggering an automated website rebuild and GitHub Pages deployment.
#
# Required Secret:
# WEBSITE_DISPATCH_TOKEN: A GitHub Fine-grained Personal Access Token (or Classic PAT with `repo` scope)
# configured in Passcodes repository secrets with permissions:
# - Contents: Read and write (for triggering repository_dispatch on PasscodesApp/Passcodes-Website)

name: 🚀 Notify Passcodes-Website on Release

on:
  release:
    types: [published, edited]

jobs:
  notify-website:
    name: Dispatch Website Rebuild Event
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Dispatch Event to Passcodes-Website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          echo "Notifying Passcodes-Website of release ${{ github.event.release.tag_name }} (${{ github.event.action }})..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/PasscodesApp/Passcodes-Website/dispatches \
            -f event_type='passcodes-release-updated' \
            -F client_payload[tag]='${{ github.event.release.tag_name }}' \
            -F client_payload[action]='${{ github.event.action }}'
